name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional test selector forwarded to jasmine (e.g. test/unit/Lexer-spec.js). Empty runs the full suite."
        required: false
        default: ""
        type: string

jobs:
  Test:
    strategy:
      fail-fast: false
      matrix:
        # Upstream ran ['lts/*', 'node'], which on the 2021-05-27 release date
        # resolved to Node 14 and Node 16. Pinned to those so the legs stay at
        # the runtimes upstream actually tested instead of floating to today's
        # Node. Node 8 is not testable: the locked jasmine 3.7.0 ships
        # lib/loader.js with a dynamic import(), a parse-time SyntaxError there.
        node_version: ['14', '16']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci --registry=https://:2021-05-27T00%3A00%3A00.000Z@time-machines-npm.sealsecurity.io/
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm test -- ${{ inputs.test-filter }}
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        if: inputs.test-filter == ''
        run: npm run test:specs
      - name: Pin npm to the release-time packer
        if: matrix.node_version == '14'
        run: npm i -g npm@7.12.0
      - name: Pack 📦
        if: matrix.node_version == '14'
        run: npm pack
      - name: Upload Package Artifact
        if: matrix.node_version == '14'
        uses: actions/upload-artifact@v4
        with:
          name: marked-2.0.6-tgz
          path: marked-2.0.6.tgz
          if-no-files-found: error
